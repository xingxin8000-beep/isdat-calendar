name: Build calendar

on:
  push:
    paths:
      - 'courses.csv'
      - 'generate_calendar.py'
      - '.github/workflows/build-calendar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate ICS
        run: python generate_calendar.py

      - name: Commit updated calendars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ISDAT_Courses.ics ISDAT_Atelier_Recherches.ics
          git diff --cached --quiet || git commit -m "Update calendars"
          git push
