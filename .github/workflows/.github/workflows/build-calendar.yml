name: Build ISDAT calendars

on:
  push:
    paths:
      - 'courses.csv'
      - 'generate_calendar.py'
      - '.github/workflows/build-calendar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate calendars
        run: python generate_calendar.py

      - name: Commit generated calendars
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ISDAT_Courses.ics ISDAT_Atelier_Recherches.ics
          git diff --cached --quiet || git commit -m 'Auto-build ISDAT calendars'
          git push
